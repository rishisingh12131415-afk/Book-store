<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Frame</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .header {
            height: 120px;
            text-align: center;
            background-color: #f7bd83;
        }

        .logo {
            float: left;
            width: 20%;
            height: 70px;
            padding-top: 20px;
            font-size: 30px;
            font-weight: bold;
        }

        .title {
            float: left;
            width: 80%;
            height: 70px;
            padding-top: 20px;
            font-size: 28px;
            font-weight: bold;
        }

        .menu {
            clear: both;
            display: flex;
            justify-content: space-around;
            background-color: #fbe5d6;
            padding: 12px;
        }

        .menu a {
            color: black;
            text-decoration: none;
            font-weight: bold;
        }

        .menu a:hover {
            color: blue;
        }
    </style>
</head>

<body>

<div class="header">

    <div class="logo">
        📚 Logo
    </div>

    <div class="title">
        Online Book Store
    </div>

    <div class="menu">
        <a href="home.html" target="rightFrame">Home</a>
        <a href="login.html" target="rightFrame">Login</a>
        <a href="registration.html" target="rightFrame">Registration</a>
        <a href="catalogue.html" target="rightFrame">Catalogue</a>
        <a href="cart.html" target="rightFrame">Cart</a>
    </div>

</div>


    
</body>
</html>
