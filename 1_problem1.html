<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKTU Student Login ERP</title>
    <link rel="stylesheet" href="mystyle1.css">
</head>
<body>
    <div class="login-container">
       
        <div class="login-header">
            <h2>AKTU ERP LOGIN</h2>
            <p>Enter your university roll number and password to access your dashboard</p>
        </div>
    
        <form action="#" method="POST">
            <div class="input-group">
                <label for="rollno">User ID / Roll Number</label>
                <input type="text" id="rollno" placeholder="e.g., 2100290100001" required>
            </div>
            
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter password" required>
            </div>
            
            <div class="form-actions">
                <label class="remember-me">
                    <input type="checkbox"> Remember Me
                </label>
                <a href="#" class="forgot-link">Forgot Password?</a>
            </div>
            
            <button type="submit" class="login-btn">Login</button>
        </form>
    </div>
</body>
</html>
